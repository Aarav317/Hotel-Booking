<!DOCTYPE html>
<html>

<head>

    <title>Login - DineAhead</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f1eb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 90%;
            max-width: 450px;

            background-color: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.1);

            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .logo span {
            color: #e8a83e;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e8a83e;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background-color: #e8a83e;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #d9972f;
        }

        .register-text {
            margin-top: 20px;
            color: #555;
        }

        .register-text a {
            color: #e8a83e;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            Dine<span>Ahead</span>
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to manage your table bookings.
        </p>


        <form action="/login" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >


            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
